<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="x-apple-disable-message-reformatting" />
<meta name="color-scheme" content="light only" />
<meta name="supported-color-schemes" content="light" />
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
<title>Message support</title>
<style>
  body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
  img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
  body { margin:0; padding:0; width:100% !important; height:100% !important; }
  a { text-decoration:none; }
  .wa-btn:hover { background:#0b565c !important; }
  @media (max-width:600px) {
    .wa-container { width:100% !important; }
    .wa-px { padding-left:24px !important; padding-right:24px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f2f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#101828;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">Vous avez reçu un nouveau message de l'équipe support Water Ambassador.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f4f6;">
    <tr>
      <td align="center" style="padding:48px 14px;">
        <table role="presentation" class="wa-container" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">

          <tr><td style="height:3px;line-height:3px;font-size:0;background:#0f6e76;border-radius:3px 3px 0 0;">&nbsp;</td></tr>

          <tr>
            <td style="background:#ffffff;border:1px solid #e3e7ea;border-top:none;border-radius:0 0 12px 12px;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td class="wa-px" style="padding:26px 40px;border-bottom:1px solid #eceff2;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td width="26" style="width:26px;height:26px;background:#101828;border-radius:6px;text-align:center;vertical-align:middle;color:#ffffff;font-size:13px;font-weight:700;line-height:26px;">W</td>
                        <td style="padding-left:10px;font-size:13px;font-weight:700;letter-spacing:0.5px;color:#101828;">WATER AMBASSADOR</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td class="wa-px" style="padding:36px 40px 4px 40px;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="vertical-align:middle;padding-right:8px;">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 5h16v10H8l-4 4V5z" stroke="#0f6e76" stroke-width="1.6" stroke-linejoin="round"/>
                          </svg>
                        </td>
                        <td style="font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#0f6e76;vertical-align:middle;">Message du support</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td class="wa-px" style="padding:14px 40px 0 40px;">
                    <p style="margin:0 0 18px 0;color:#5b6472;font-size:14.5px;line-height:1.7;">Bonjour {{ first_name|default:'Ambassadeur' }},</p>
                  </td>
                </tr>
                <tr>
                  <td class="wa-px" style="padding:0 40px 8px 40px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f9fa;border:1px solid #e3e7ea;border-radius:10px;">
                      <tr>
                        <td style="padding:18px 20px;color:#101828;font-size:14.5px;line-height:1.75;white-space:pre-line;">{{ message }}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                {% if site_url %}
                <tr>
                  <td class="wa-px" style="padding:26px 40px 34px 40px;">
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td bgcolor="#0f6e76" style="border-radius:8px;">
                          <a href="{{ site_url }}" class="wa-btn" style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#ffffff;background:#0f6e76;border-radius:8px;">Ouvrir la plateforme</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                {% else %}
                <tr><td style="height:22px;line-height:22px;font-size:0;">&nbsp;</td></tr>
                {% endif %}
              </table>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td class="wa-px" style="padding:20px 40px;border-top:1px solid #eceff2;text-align:center;color:#8a93a6;font-size:12px;line-height:1.7;">© {{ current_year }} Water Ambassador</td>
                </tr>
              </table>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

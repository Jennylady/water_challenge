<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message support</title>
</head>
<body style="margin:0;padding:0;background:#eef6ff;font-family:Arial,Helvetica,sans-serif;color:#101828;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#eef6ff;padding:32px 12px;">
    <tr><td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:640px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 18px 38px rgba(16,71,128,0.12);">
        <tr><td style="background:linear-gradient(135deg,#101828,#126bff);padding:32px;text-align:center;color:#fff;">
          <div style="font-size:42px;margin-bottom:10px;">💬</div>
          <h1 style="margin:0;font-size:26px;font-weight:900;">Message du support</h1>
        </td></tr>
        <tr><td style="padding:34px 32px;">
          <p style="margin:0 0 16px 0;color:#475467;font-size:15px;line-height:1.7;">Bonjour {{ first_name|default:'Ambassadeur' }},</p>
          <div style="background:#f8fbff;border:1px solid #dbeafe;border-radius:12px;padding:18px;color:#101828;font-size:15px;line-height:1.75;white-space:pre-line;">{{ message }}</div>
          {% if site_url %}
          <div style="text-align:center;margin:28px 0 0 0;">
            <a href="{{ site_url }}" style="display:inline-block;background:#126bff;color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:13px 24px;border-radius:10px;">Ouvrir la plateforme</a>
          </div>
          {% endif %}
        </td></tr>
        <tr><td style="padding:20px 32px;background:#f8fbff;text-align:center;color:#7a8495;font-size:12px;border-top:1px solid #dbeafe;">© {{ current_year }} Water Ambassador</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

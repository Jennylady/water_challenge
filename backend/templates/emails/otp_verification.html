<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code OTP</title>
</head>
<body style="margin:0;padding:0;background:#eef6ff;font-family:Arial,Helvetica,sans-serif;color:#101828;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#eef6ff;padding:32px 12px;">
    <tr><td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 18px 38px rgba(16,71,128,0.12);">
        <tr><td style="background:linear-gradient(135deg,#126bff,#0758df);padding:30px;text-align:center;color:#fff;">
          <div style="font-size:44px;margin-bottom:8px;">🔐</div>
          <h1 style="margin:0;font-size:26px;font-weight:900;">Vérification de sécurité</h1>
          <p style="margin:8px 0 0 0;opacity:.9;font-size:14px;">Utilisez ce code pour continuer.</p>
        </td></tr>
        <tr><td style="padding:34px 30px;text-align:center;">
          <p style="margin:0 0 18px 0;color:#475467;font-size:15px;line-height:1.7;">Bonjour {{ first_name|default:'Ambassadeur' }}, voici votre code de vérification :</p>
          <div style="display:inline-block;letter-spacing:8px;background:#f8fbff;border:1px solid #dbeafe;border-radius:14px;padding:18px 24px;color:#126bff;font-size:34px;font-weight:900;">{{ otp }}</div>
          <p style="margin:20px 0 0 0;color:#7a8495;font-size:13px;line-height:1.6;">Ce code est personnel. Ne le partagez avec personne.</p>
        </td></tr>
        <tr><td style="padding:20px 30px;background:#f8fbff;text-align:center;color:#7a8495;font-size:12px;border-top:1px solid #dbeafe;">© {{ current_year }} Water Ambassador</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
